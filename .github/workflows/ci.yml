name: CI

# Tests never touch a GPU, a network or a real engine: the Ollama adapter runs
# against recorded stream fixtures and the runner against the mock backend. So
# CI needs nothing but a Python interpreter, and a failure here is a real
# failure rather than a missing accelerator.
# Read-only token: nothing here writes to the repository, publishes a package
# or needs a secret.
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest
      - name: Dry run the whole pipeline
        # The dry run exercises runner, storage, grading, reporting and export
        # with canned responses. It has caught breakage that unit tests missed.
        run: |
          caliper run --dry-run --allow-code-execution --label ci
          caliper report
          caliper export --out-dir "$RUNNER_TEMP/export"
