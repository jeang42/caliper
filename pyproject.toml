[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper"
# Single source of truth is caliper.__version__. A literal here drifted from it
# silently: the package said 0.4.0 while the installed distribution said 0.1.0.
dynamic = ["version"]
description = "Local LLM benchmarking and evaluation framework (Ollama first, vLLM planned)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Angelcyk" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["llm", "benchmark", "evaluation", "ollama", "local-inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
caliper = "caliper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "caliper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caliper = ["evals/suites/*/*.toml", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
